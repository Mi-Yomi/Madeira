name: Unsigned iOS app bootstrap

on:
  workflow_dispatch:
  push:
    branches: [compatibility/desktop-apps]
    paths:
      - .github/workflows/unsigned-app-bootstrap.yml
      - build/app-ios/**
      - app/Madeira.xcodeproj/**
      - app/Madeira/**
      - app/MadeiraJITHelper/**
      - tests/host/check-app-bootstrap.py
      - tests/host/check-app-workflow.py
      - tests/host/check-crypto-link-tables.py
      - tests/host/check-fex-snapshot-link.py
      - build/fex-ios/**
      - build/ntdll-unix/**
      - build/crypto-unix/**
      - build/llvm-ios/**
      - build/dxmt-ios/**
      - FEX
      - wine
      - dxmt

permissions:
  contents: read

concurrency:
  group: unsigned-app-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-validation:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify app, package, signing and workflow failure gates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/host/check-app-bootstrap.py
          python3 tests/host/check-app-workflow.py
          python3 tests/host/check-graphics-bootstrap.py
          python3 tests/host/check-native-bootstrap-artifacts.py
          python3 tests/host/check-fex-source-repairs.py
          python3 tests/host/check-fex-snapshot-link.py
          python3 tests/host/check-crypto-link-tables.py
  unsigned-app:
    needs: portable-validation
    if: github.event.repository.private == false
    # Standard free public-repository ARM64 runner; all stages share one fresh
    # workspace because cache/artifact storage has not been authorized.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      JOBS: '2'
      BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CARGO_BUILD_JOBS: '2'
      MAKEFLAGS: -j2
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Initialize temporary diagnostics
        run: |
          printf 'NATIVE_LOG_DIR=%s\nNATIVE_ARTIFACT_DIR=%s\n' "$RUNNER_TEMP/madeira-app-native-logs" "$RUNNER_TEMP/madeira-app-native-artifacts" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/madeira-app-native-logs"
      - name: Checkout exact public sources and recursive pins
        timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify app gates on macOS before dependency builds
        timeout-minutes: 2
        run: |
          python3 tests/host/check-app-bootstrap.py
          python3 tests/host/check-app-workflow.py
          python3 tests/host/check-graphics-bootstrap.py
          python3 tests/host/check-fex-source-repairs.py
          python3 tests/host/check-fex-snapshot-link.py
          python3 tests/host/check-crypto-link-tables.py
      - name: Build and validate native dependencies first
        timeout-minutes: 35
        # Includes the previously authorized official Metal setup and its gate.
        # Native provenance requires a clean checkout before generated outputs.
        run: bash .github/ci/native-bootstrap.sh
      - name: Fetch pinned LLVM and preflight all Metal sources
        timeout-minutes: 5
        run: |
          bash build/llvm-ios/build.sh fetch
          bash build/dxmt-ios/generate-shaders.sh preflight
      - name: Build LLVM host tools and require every AIR decode
        timeout-minutes: 12
        run: |
          bash build/llvm-ios/build.sh host
          bash build/dxmt-ios/generate-shaders.sh
      - name: Build and validate iOS LLVM archives
        timeout-minutes: 25
        run: bash build/llvm-ios/build.sh ios
      - name: Build and validate the complete DXMT archive
        timeout-minutes: 10
        run: python3 build/dxmt-ios/clean_build.py
      - name: Link Debug app and verify local unsigned IPA
        timeout-minutes: 10
        run: |
          python3 build/app-ios/build_unsigned.py \
            --native-receipt "$NATIVE_ARTIFACT_DIR/provenance.json" \
            --products "$RUNNER_TEMP/madeira-app-products" \
            --intermediates "$RUNNER_TEMP/madeira-app-intermediates" \
            --stage "$RUNNER_TEMP/madeira-app-stage"
      - name: Collect bounded native diagnostics
        if: always()
        timeout-minutes: 1
        run: |
          if [ -f .github/ci/collect-native-logs.py ]; then
            python3 .github/ci/collect-native-logs.py
          fi
          df -h "$RUNNER_TEMP"
      # The unsigned IPA remains temporary. No storage/upload, export, signing,
      # installation, secrets or provisioning step is enabled by this gate.
