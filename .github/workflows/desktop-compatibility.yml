name: Desktop compatibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check native argument decoding and PE routing
        env:
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
        run: |
          python3 tests/host/check-launch-arguments.py
          python3 tests/host/check-launch-routing.py
          python3 tests/host/check-working-directory.py --c-only
          python3 tests/host/check-launch-diagnostics.py --source-only
          python3 tests/host/check-cfg-game.py
      - name: Check absent-GL ABI and hidden-window behavior
        run: |
          python3 tests/host/check-gl-absent.py
          python3 tests/host/check-unixlib-binder.py
          python3 tests/host/check-window-visibility.py
          CFLAGS='-fsanitize=undefined -fno-sanitize-recover=all' python3 tests/host/check-max-track-size.py
          CFLAGS='-fsanitize=undefined -fno-sanitize-recover=all' python3 tests/host/check-display-size.py --c-only
      - name: Check native-bootstrap failure handling and artifact validation
        run: |
          python3 tests/host/check-native-bootstrap-scripts.py
          python3 tests/host/check-fex-source-repairs.py
          python3 tests/host/check-fex-snapshot-link.py
          python3 tests/host/check-crypto-link-tables.py
          python3 tests/host/check-fex-native-object.py
          python3 tests/host/check-fex-cmake-layout.py
          python3 tests/host/check-metal-toolchain-setup.py
          python3 tests/host/check-native-bootstrap-artifacts.py
          python3 tests/host/check-native-bootstrap-workflow.py
      - name: Check child lifetime and bounded crash diagnostics
        run: |
          python3 tests/host/check-child-lifetime.py
          python3 tests/host/check-jit-dump.py
      - name: Check desktop DLL inventory, evidence and integration plans
        run: |
          python3 tests/host/check-guest-dll-inventory.py
          python3 tests/host/check-desktop-build-receipts.py
          python3 tests/host/check-desktop-symbol-audit.py
          python3 tests/host/check-desktop-overlay-plan.py
          python3 tests/host/check-desktop-integration.py
          python3 -O tests/host/check-desktop-integration.py
          python3 tests/host/check-msi-integration.py
          python3 -O tests/host/check-msi-integration.py
          python3 tests/host/check-loader-integration.py
          python3 -O tests/host/check-loader-integration.py
          python3 tests/host/check-msi-client-integration.py
          python3 -O tests/host/check-msi-client-integration.py
          python3 tests/host/check-msi-startup-integration.py
          python3 -O tests/host/check-msi-startup-integration.py
          python3 tests/host/check-msi-windows-reference.py
          python3 tests/host/check-msi-madeira-reference.py
          python3 tests/host/check-mesa-windows-reference.py
          python3 tests/host/check-mesa-modern-canary.py
      - name: Check Blender probe syntax
        run: python3 -m py_compile tests/desktop/blender_cpu_smoke.py
      - name: Check JIT pool ownership and readiness wiring
        run: |
          python3 tests/host/check-jit-method.py
          python3 tests/host/check-jit-pool-release.py --source-only
          python3 tests/host/check-jit-alias-placement.py --source-only
          python3 tests/host/check-launch-readiness.py --source-only
          python3 tests/host/check-dock-watch-lifetime.py --source-only
          python3 tests/host/check-memory-overlay.py --source-only
      - name: Check Unicode input queue with sanitizers
        env:
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
        run: python3 tests/host/check-unicode-input.py

  swift-input:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check compiled mouse-wheel routing
        run: python3 tests/host/check-mouse-wheel.py
      - name: Check one-shot JIT placeholder release and quiet readiness
        run: python3 tests/host/check-jit-pool-release.py
      - name: Check compiled JIT alias retry order
        run: python3 tests/host/check-jit-alias-placement.py
      - name: Check compiled launch readiness and Dock report ownership
        run: |
          python3 tests/host/check-launch-readiness.py
          python3 tests/host/check-dock-watch-lifetime.py
      - name: Check compiled memory overlay and timer lifecycle
        run: python3 tests/host/check-memory-overlay.py
      - name: Check compiled launch-profile validation
        run: python3 tests/host/check-launch-validation.py
      - name: Check compiled executable paths and Unicode confinement
        run: python3 tests/host/check-executable-paths.py
      - name: Check compiled working folders and launch diagnostics
        run: |
          python3 tests/host/check-working-directory.py
          python3 tests/host/check-launch-diagnostics.py
          python3 tests/host/check-frontend.py
          python3 tests/host/check-display-size.py
          python3 tests/host/check-steam-games.py
      - name: Check compiled Unicode encoding and queue
        run: python3 tests/host/check-unicode-input.py
      - name: Check explicit single-line clipboard insertion
        run: python3 tests/host/check-clipboard-text.py
